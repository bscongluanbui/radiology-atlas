<dialog id="viewerSessionDialog" class="viewer-session-dialog" open aria-labelledby="viewerSessionTitle" aria-describedby="viewerSessionMessage">
  <h2 id="viewerSessionTitle">Phiên viewer</h2>
  <p id="viewerSessionMessage" role="status" aria-live="polite">Đang kiểm tra phiên viewer…</p>
  <input id="viewerSessionCsrf" type="hidden" name="csrf" value="{{ csrf_token() }}">
  <div class="viewer-session-actions">
    <button id="viewerSessionRetry" type="button" hidden>Thử lại</button>
    <button id="viewerSessionTakeover" type="button" hidden>Đăng xuất phiên cũ</button>
    <a href="/anatomy">Về Anatomy</a>
  </div>
  <noscript>Hãy bật JavaScript để kiểm tra phiên và mở viewer.</noscript>
</dialog>
<p id="viewerConnectionStatus" class="viewer-connection-status" role="status" aria-live="polite" hidden></p>
