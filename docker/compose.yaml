name: radiology-atlas
services:
  viewer:
    image: ${VIEWER_IMAGE:-ghcr.io/bscongluanbui/radiology-atlas:latest}
    restart: unless-stopped
    environment:
      DATA_ROOT: /data
      STATE_DIR: /state
      ALLOWED_HOSTS: ${DDNS_HOST},localhost,127.0.0.1
      METADATA_CACHE_MIB: ${METADATA_CACHE_MIB:-512}
      BROWSER_CACHE_MIB: ${BROWSER_CACHE_MIB:-512}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-1800}
      DECODED_IMAGE_CACHE: ${DECODED_IMAGE_CACHE:-32}
      DECODE_FORWARD: ${DECODE_FORWARD:-20}
      DECODE_BACKWARD: ${DECODE_BACKWARD:-11}
      DECODE_CONCURRENCY: ${DECODE_CONCURRENCY:-2}
      PRELOAD_CONCURRENCY: ${PRELOAD_CONCURRENCY:-2}
      IMAGE_CONCURRENCY: ${IMAGE_CONCURRENCY:-4}
      SESSION_IDLE_SECONDS: ${SESSION_IDLE_SECONDS:-1800}
      SESSION_LIFETIME_SECONDS: ${SESSION_LIFETIME_SECONDS:-28800}
    expose: ["8080"]
    volumes:
      - type: bind
        source: ${DATA_ROOT}
        target: /data
        read_only: true
      - atlas-state:/state
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: ${VIEWER_MEMORY_LIMIT:-3g}
    pids_limit: 256
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    networks: [backend]
  caddy:
    profiles: ["direct"]
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      viewer: {condition: service_healthy}
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DDNS_HOST: ${DDNS_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777,noexec,nosuid,nodev"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3"}
    networks: [backend, edge]
networks:
  backend: {name: radiology-atlas_backend, internal: true}
  edge: {}
volumes:
  atlas-state:
  caddy-data:
  caddy-config:
